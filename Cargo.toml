[package]
name = "gitmind"
version = "0.1.0"
edition = "2024"

[dependencies]
crossterm = "0.29.0"
dirs = "7"
git2 = { version = "0.21.0", features = ["https", "ssh"] }
ratatui = "0.30.2"
rig-core = "0.42"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
toml = "1"
